experiment:
  runs: 200
  horizon: 200
  seed: 42
  output_dir: results/multi/lupu_2019L/figure3_repro
  add_opt: false
  order: [OUCB, SBLFE, TS, UCB, non_learner]

environment:
  n_arms: 10
  delta: 0.2
  best_mean: 0.9

agents:
  - name: OUCB
    class: OUCB
    params:
      nbr_neighbours: 1
      c: 1.0
      social_weight: 1.0
  - name: SBLFE
    class: SBLFE
    params:
      beta: 1.0
      social_weight: 0.5
  - name: TS
    class: TS
  - name: UCB
    class: UCB
  - name: non_learner
    class: alphaOptimal
    params:
      alpha: 0.5
