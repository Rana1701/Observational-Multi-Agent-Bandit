experiment:
  runs: 20
  horizon: 1000
  seed: 42
  n_agents: 11
  order: [UCB clique, single UCB, LLM clique]
  output_dir: results/multi/current/lupu_2019L_exp_qwen/figure3

environment:
  n_arms: 2
  delta: 0.1
  best_mean: 0.5

agents:
  - name: single UCB
    class: UCB

  - name: UCB clique
    class: UCBClique
    params:
      clique_size: 11

  - name: LLM clique
    class: LLMClique
    params:
      clique_size: 11
      model : "Qwen/Qwen2.5-7B-Instruct"