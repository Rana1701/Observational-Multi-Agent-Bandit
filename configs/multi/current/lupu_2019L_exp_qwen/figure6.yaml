experiment:
  runs: 20
  horizon: 100
  seed: 42
  n_jobs: 1
  interaction: sequential
  input_dir: Target-UCB/Human bandit dataset/cliques/
  output_dir: results/multi/current/lupu_2019L_exp_qwen/figure6

environment:
  n_arms: 2
  delta: 0.2
  best_mean: 0.6
  probs: [0.6,0.4]

agents:
  - name: LLM clique
    class: LLM
    observes: [Human]
    params:
      model: Qwen/Qwen2.5-7B-Instruct

humanFiles:
  files:
    - human_clique_2_plays.csv