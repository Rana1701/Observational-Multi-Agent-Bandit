experiment:
  runs: 2
  horizon: 1000
  seed: 42
  n_agents: 20
  output_dir: results/multi/test4

environment:
  n_arms: 10

agents:
  - name: single UCB
    class: UCB

  - name: UCB clique
    class: UCBClique
    params:
      clique_size: 20

  - name: LLM graph
    class: LLM
    params:
      model: Qwen/Qwen2.5-7B-Instruct