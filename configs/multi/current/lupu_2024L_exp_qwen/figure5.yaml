experiment:
  runs: 20
  horizon: 100
  seed: 42
  n_jobs: 1
  interaction: sequential
  input_dir: Target-UCB/Human bandit dataset/single_humans/
  output_dir: results/multi/lupu_2024L_exp_qwen/figure5

environment:
  n_arms: 2
  delta: 0.2
  best_mean: 0.6
  probs: [0.4,0.6]

agents:
  - name: LLM
    class: LLM
    observes: [Human]
    params:
      model: Qwen/Qwen2.5-7B-Instruct

humanFiles:
  files:
    - single_human_1_plays.csv
    - single_human_2_plays.csv
    - single_human_3_plays.csv
