experiment:
  seed: 40
  n_jobs: 4
  output_dir: results/multi/current/models_comparison/DeepSeek-R1-Distill-Qwen-32B
  horizon: 500
  runs: 20
  order: [ucb, Greedy, ts, LLM]
  track_other_actions_for: ["ucb", "Greedy", "ts"]
  add_opt: False

environment:
  n_arms: 5
  delta: 0.2
  best_mean: 0.6
  probs: [0.4, 0.4, 0.6, 0.4, 0.4]

agents:
  - name: ucb
    class: UCB

  - name: ts
    class: TS

  - name: Greedy
    class: Greedy

  - name: LLM
    class: LLM
    prompt: default
    params:
      model: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
